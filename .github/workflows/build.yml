name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ssr:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kentaromorishitas-projects

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install latest Seseragi CLI
        run: cargo install --git https://github.com/KentaroMorishita/seseragi --locked seseragi-cli

      - name: Refresh lockfile for current Seseragi main
        run: seseragi lock update

      - name: Build Seseragi process artifact
        run: |
          rm -rf generated
          seseragi build . --out-dir generated
          test -f generated/entry.ts
          test -f generated/.seseragi-build.json

      - name: Prove generated artifact runs on Bun
        shell: bash
        run: |
          set -euo pipefail

          timeout 60s bun generated/entry.ts >/tmp/seseragi-ssr-demo.log 2>&1 &
          server_pid=$!
          ok=0

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/hello-ssr >/tmp/page.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/seseragi-ssr-demo.log
            exit 1
          fi

          wait "$server_pid"

          grep -q '<!doctype html>' /tmp/page.html
          grep -q 'Rendered on the server' /tmp/page.html
          grep -q 'Seseragi SSR' /tmp/page.html
          grep -q '/hello-ssr' /tmp/page.html
          grep -q 'counter-app' /tmp/page.html
          grep -q 'Hydrated interaction' /tmp/page.html
          grep -q '>0<' /tmp/page.html

      - name: Build Seseragi browser hydration client
        shell: bash
        run: |
          set -euo pipefail

          rm -rf client-dist
          seseragi lock update client
          seseragi build client --out-dir client-dist

          test -f client-dist/assets/app.js
          test -f client-dist/.seseragi-build.json
          grep -q 'counter-app' client-dist/assets/app.js

      - name: Bundle Vercel Bun function
        shell: bash
        run: |
          set -euo pipefail

          view_module="$(grep -R -l --include='*.ts' 'export const render =' generated | head -n 1)"
          test -n "$view_module"

          mkdir -p api
          sed \
            -e "s|__SESERAGI_VIEW_MODULE__|../$view_module|" \
            -e "s|__SESERAGI_CLIENT_MODULE__|../client-dist/assets/app.js|" \
            vercel/entry.ts > api/index.ts

          bun build api/index.ts \
            --target=bun \
            --outfile=/tmp/seseragi-ssr-vercel.js

          rm -f api/index.ts
          rm -rf generated client-dist
          cp /tmp/seseragi-ssr-vercel.js api/index.js

          test -f api/index.js
          grep -q 'Bun' api/index.js
          grep -q 'counter-app' api/index.js

      - name: Prove Vercel bundle runs on Bun
        shell: bash
        run: |
          set -euo pipefail

          bun api/index.js >/tmp/seseragi-vercel-bundle.log 2>&1 &
          server_pid=$!
          ok=0

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/vercel-bun >/tmp/vercel-page.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/seseragi-vercel-bundle.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/client.js >/tmp/client.js

          grep -q '<!doctype html>' /tmp/vercel-page.html
          grep -q 'Rendered on the server' /tmp/vercel-page.html
          grep -q '/vercel-bun' /tmp/vercel-page.html
          grep -q 'counter-app' /tmp/vercel-page.html
          grep -q 'src="/client.js"' /tmp/vercel-page.html
          grep -q 'counter-app' /tmp/client.js

      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest project inspect seseragi-ssr-demo \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add seseragi-ssr-demo \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

          bunx vercel@latest deploy . \
            --prod \
            --yes \
            --project seseragi-ssr-demo \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN"

      - name: Vercel deployment is not configured
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN == ''
        run: echo "Set the VERCEL_TOKEN repository secret to enable production deployment."
