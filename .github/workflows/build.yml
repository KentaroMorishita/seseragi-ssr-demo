name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ssr:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kentaromorishitas-projects

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Resolve current Seseragi main
        id: seseragi-main
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/KentaroMorishita/seseragi refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore Seseragi CLI
        id: seseragi-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/seseragi
          key: seseragi-cli-${{ runner.os }}-${{ steps.seseragi-main.outputs.sha }}

      - name: Install latest Seseragi CLI
        if: steps.seseragi-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/KentaroMorishita/seseragi --locked seseragi-cli

      - name: Cache Seseragi CLI
        if: steps.seseragi-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/seseragi
          key: seseragi-cli-${{ runner.os }}-${{ steps.seseragi-main.outputs.sha }}

      - name: Refresh lockfiles for current Seseragi main
        run: |
          seseragi lock update
          seseragi lock update client

      - name: Build Seseragi process artifact
        run: |
          rm -rf generated
          seseragi build . --out-dir generated
          test -f generated/entry.ts
          test -f generated/.seseragi-build.json

      - name: Prove SQLite CRUD and SSR on Bun
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/seseragi-ssr-demo.sqlite

          bun generated/entry.ts >/tmp/seseragi-todo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/seseragi-todo.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3001/ >/tmp/page-before.html
          curl --fail --silent http://127.0.0.1:3001/api/todos >/tmp/todos-before.json

          grep -q '<!doctype html>' /tmp/page-before.html
          grep -q 'Seseragi Todo' /tmp/page-before.html
          grep -q 'todo-app' /tmp/page-before.html
          grep -q 'SQLite on Bun' /tmp/page-before.html
          grep -q 'Persist this list in SQLite' /tmp/page-before.html

          bun -e '
            const todos = await Bun.file("/tmp/todos-before.json").json();
            if (!Array.isArray(todos) || todos.length !== 3) process.exit(1);
            if (!todos.some((todo) => todo.title === "Persist this list in SQLite" && todo.completed === false)) process.exit(1);
          '

          curl --fail --silent \
            -X POST \
            -H 'content-type: text/plain; charset=utf-8' \
            --data-binary 'CI Todo roundtrip' \
            http://127.0.0.1:3001/api/todos >/tmp/todos-created.json

          bun -e '
            const todos = await Bun.file("/tmp/todos-created.json").json();
            if (!todos.some((todo) => todo.title === "CI Todo roundtrip" && todo.completed === false)) process.exit(1);
          '

          curl --fail --silent http://127.0.0.1:3001/ >/tmp/page-after.html
          grep -q 'CI Todo roundtrip' /tmp/page-after.html

          curl --fail --silent \
            -X POST \
            --data-binary '3' \
            http://127.0.0.1:3001/api/todos/toggle >/tmp/todos-toggled.json

          bun -e '
            const todos = await Bun.file("/tmp/todos-toggled.json").json();
            const todo = todos.find((item) => item.id === 3);
            if (!todo || todo.completed !== true) process.exit(1);
          '

          curl --fail --silent \
            -X POST \
            --data-binary '3' \
            http://127.0.0.1:3001/api/todos/delete >/tmp/todos-deleted.json

          bun -e '
            const todos = await Bun.file("/tmp/todos-deleted.json").json();
            if (todos.some((todo) => todo.id === 3)) process.exit(1);
          '

      - name: Build Seseragi browser hydration client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf client-dist
          seseragi build client --out-dir client-dist
          test -f client-dist/assets/app.js
          test -f client-dist/.seseragi-build.json
          grep -q 'todo-app' client-dist/assets/app.js
          grep -q 'todo-list' client-dist/assets/app.js

      - name: Build Vercel container image
        run: docker build -f Dockerfile.vercel -t seseragi-ssr-demo:test .

      - name: Prove container serves Todo, client and SQLite
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -d \
            --name seseragi-ssr-demo-test \
            -e PORT=8080 \
            -p 8080:8080 \
            seseragi-ssr-demo:test

          trap 'docker rm -f seseragi-ssr-demo-test >/dev/null 2>&1 || true' EXIT

          ok=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            docker logs seseragi-ssr-demo-test
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/ >/tmp/container-page.html
          curl --fail --silent http://127.0.0.1:8080/client.js >/tmp/container-client.js
          curl --fail --silent http://127.0.0.1:8080/api/todos >/tmp/container-todos.json

          grep -q '<!doctype html>' /tmp/container-page.html
          grep -q 'Seseragi Todo' /tmp/container-page.html
          grep -q 'todo-app' /tmp/container-page.html
          grep -q 'src="/client.js"' /tmp/container-page.html
          grep -q 'todo-app' /tmp/container-client.js

          bun -e '
            const todos = await Bun.file("/tmp/container-todos.json").json();
            if (!Array.isArray(todos) || todos.length !== 3) process.exit(1);
          '

          curl --fail --silent \
            -X POST \
            -H 'content-type: text/plain; charset=utf-8' \
            --data-binary 'Container SQLite roundtrip' \
            http://127.0.0.1:8080/api/todos >/tmp/container-created.json

          curl --fail --silent http://127.0.0.1:8080/ >/tmp/container-page-after.html
          grep -q 'Container SQLite roundtrip' /tmp/container-page-after.html

      - name: Deploy Vercel container
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest project inspect seseragi-ssr-demo \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add seseragi-ssr-demo \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

          bunx vercel@latest deploy . \
            --prod \
            --yes \
            --project seseragi-ssr-demo \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN"

      - name: Vercel deployment is not configured
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN == ''
        run: echo "Set the VERCEL_TOKEN repository secret to enable production deployment."
